# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Jacob Gildenblat
email: jacob.gildenblat@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  👋 Welcome to my personal tech blog about Deep Learning, Machine Learning and Computer Vision. Since 2014.
# Default image used for link previews (Open Graph / Twitter cards) on any page
# that doesn't set its own `image:` in front matter.
image: /assets/header.jpg
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jacobgil.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter:
  username: jacobgildenblat
github_username:  jacobgil

comments:
 provider: disqus
disqus: 
 short_name: jacobgil.github.io

# Universal Analytics (UA-88816088-1) was shut down by Google in July 2023 and
# stopped collecting data. Put a GA4 measurement ID ("G-XXXXXXXXXX") here to turn
# analytics back on; anything else and no tracking script is loaded at all.
google_analytics:
# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax

theme:
plugins:
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

excerpt_separator: <!--more-->  # you can specify your own separator, of course.